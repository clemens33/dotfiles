# Auto-request a GitHub Copilot code review on every PR.
#
# Pattern proven in the ai-data-pipelines repo (2026-08): GraphQL requestReviews
# with the Copilot reviewer bot id, plain GITHUB_TOKEN, no PAT, no secret.
# Deliberately NOT triggered on `synchronize` — re-reviewing every push is where
# the Copilot-credit bill appears. Instruction files steer the review:
#   .github/copilot-instructions.md            (repo-wide invariants)
#   .github/instructions/*.instructions.md     (path-scoped, e.g. skills/**)
name: copilot-review

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    # Draft PRs get their review on ready_for_review, not on open.
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # REST request; the bot registers only when the repo owner has a
          # Copilot seat. No seat -> the API answers 2xx with an empty
          # requested_reviewers list (verified live 2026-08-12), so treat
          # "not registered" as a clean skip, never a failure.
          resp=$(gh api -X POST \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]" \
            --jq '[.requested_reviewers[].login]' 2>&1) || {
            echo "Request failed: $resp"
            echo "Skipping — Copilot review not available here."
            exit 0
          }
          if echo "$resp" | grep -qi copilot; then
            echo "Copilot review requested."
          else
            echo "Copilot reviewer did not register (no seat on this repo's owner) — skipped."
          fi
