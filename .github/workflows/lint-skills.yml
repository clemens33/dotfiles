name: Lint skills

on:
  pull_request:
    paths:
      - ".github/workflows/lint-skills.yml"
      - "skills/**"
      - "scripts/lint-skills.sh"
      - "scripts/lint-skills-test.sh"
      - "scripts/lint-skills.waivers"
      - "install.conf.yaml"
  push:
    paths:
      - ".github/workflows/lint-skills.yml"
      - "skills/**"
      - "scripts/lint-skills.sh"
      - "scripts/lint-skills-test.sh"
      - "scripts/lint-skills.waivers"
      - "install.conf.yaml"

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.3

      - name: Run lint-skills.sh unit tests
        run: ./scripts/lint-skills-test.sh

      - name: Lint skills
        run: ./scripts/lint-skills.sh skills/
