    ~/.claude/skills/gcp-operations: skills/gcp-operations
    ~/.claude/skills/gha-security-review: skills/gha-security-review
    ~/.claude/skills/grill-with-docs: skills/grill-with-docs
    ~/.claude/skills/humanizer: skills/humanizer
    ~/.claude/skills/improve-codebase-architecture: skills/improve-codebase-architecture
