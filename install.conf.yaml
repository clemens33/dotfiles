    ~/.claude/skills/quiz-diff: skills/quiz-diff
    ~/.claude/skills/refactor-audit: skills/refactor-audit
    ~/.claude/skills/scope: skills/scope
    ~/.claude/skills/security-review: skills/security-review
    ~/.claude/skills/setup-matt-pocock-skills: skills/setup-matt-pocock-skills
    ~/.claude/skills/skill-reducer: skills/skill-reducer
    ~/.claude/skills/tdd: skills/tdd
    ~/.claude/skills/test-audit: skills/test-audit
    ~/.claude/skills/to-issues: skills/to-issues
    ~/.claude/skills/to-prd: skills/to-prd
    ~/.claude/skills/triage: skills/triage
    ~/.claude/skills/viz: skills/viz
    ~/.claude/skills/zoom-out: skills/zoom-out

# Codex skills — same per-skill pattern. The documented user scope is
# ~/.agents/skills; ~/.codex/skills is legacy (and holds Codex's own .system
# directory, which is never managed here). Same-name skills are NOT merged
# across scopes, so the links live in exactly one root.
- link:
    ~/.agents/skills/adr: skills/adr
    ~/.agents/skills/arch-docs: skills/arch-docs
    ~/.agents/skills/caveman: skills/caveman
    ~/.agents/skills/code-review: skills/code-review
    ~/.agents/skills/collab: skills/collab
    ~/.agents/skills/cross-model-review: skills/cross-model-review
    ~/.agents/skills/diagnose: skills/diagnose
    ~/.agents/skills/drawio-diagrams-enhanced: skills/drawio-diagrams-enhanced
    ~/.agents/skills/gcp-operations: skills/gcp-operations
    ~/.agents/skills/gha-security-review: skills/gha-security-review
    ~/.agents/skills/grill-with-docs: skills/grill-with-docs
    ~/.agents/skills/humanizer: skills/humanizer
    ~/.agents/skills/improve-codebase-architecture: skills/improve-codebase-architecture
    ~/.agents/skills/large-feature: skills/large-feature
    ~/.agents/skills/manage-skills: skills/manage-skills
    ~/.agents/skills/quiz-diff: skills/quiz-diff
    ~/.agents/skills/refactor-audit: skills/refactor-audit
    ~/.agents/skills/scope: skills/scope
    ~/.agents/skills/security-review: skills/security-review
    ~/.agents/skills/setup-matt-pocock-skills: skills/setup-matt-pocock-skills
    ~/.agents/skills/skill-reducer: skills/skill-reducer
    ~/.agents/skills/tdd: skills/tdd
    ~/.agents/skills/test-audit: skills/test-audit
    ~/.agents/skills/to-issues: skills/to-issues
    ~/.agents/skills/to-prd: skills/to-prd
    ~/.agents/skills/triage: skills/triage
    ~/.agents/skills/viz: skills/viz
    ~/.agents/skills/zoom-out: skills/zoom-out

- shell:
    - command: mkdir -p ~/.config/fish
      description: Ensure fish config dir
    # The contract, concatenated and written as a REGULAR file per harness. Runs
    # after the create/link steps because it needs the identity directories to
    # exist — it renders only into identities a machine actually has, and never
    # creates one. The six targets used to be symlinks into this repo, so the
    # renderer unlinks before it moves a file into place; writing through one
    # would truncate shared/AGENTS.md. ~/.claude-mic belongs to the overlay pass,
    # which runs this same script again once that identity exists. Idempotent:
    # an unchanged target is not even rewritten.
    - command: scripts/render-contract.sh
      description: Rendering the AI contract (shared + private addendum)
      stdout: true
    # Migration (2026-08-11): codex features.shell_snapshot dumped the inherited
    # environment — secrets included — into world-readable snapshot scripts.
    # The feature is now off in codex/config.toml; purge any legacy snapshots.
    - command: |
        dir="$HOME/.codex/shell_snapshots"
        if [ -L "$dir" ]; then
          # -d follows symlinks; deleting through one would hit an unrelated
          # target. Only ever purge the real cache dir codex owns.
          echo "WARN: $dir is a symlink — refusing to purge, resolve manually"
        elif [ -d "$dir" ]; then
          n=$(ls "$dir" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -gt 0 ]; then
            rm -f "$dir"/* && echo "purged $n legacy codex shell snapshot(s) (may contain secrets)"
          fi
        fi
      description: Purge legacy codex shell snapshots
    - command: scripts/mcp-merge.sh "$HOME/.claude.json" claude/mcpServers.json
      description: Merging Claude Code MCP servers
    # Migration (2026-09-07): Codex user skills moved to ~/.agents/skills. The
    # legacy root still exists on hosts installed before this change, Codex
    # scans both, and a link there wins — so a skill deleted or renamed here
    # would keep shadowing the new root. Remove OUR links only: a symlink whose
    # recorded target points into this checkout's skills tree (either layer —
    # the wrapper always runs the public pass from the repo root, so one step
    # covers the overlay too). Never touch .system, real directories, or links
    # into anything else, and match the recorded target so links left dangling
    # by a rename are cleaned up as well.
    - command: |
        dir="$HOME/.codex/skills"
        [ -d "$dir" ] || exit 0
        find "$dir" -maxdepth 1 -type l -print | while IFS= read -r link; do
          case "$(readlink "$link")" in
            "$PWD"/skills/*|"$PWD"/dotfiles-mic/skills/*)
              rm "$link" && echo "retired legacy codex skill link ${link##*/} (now served from ~/.agents/skills)" ;;
          esac
        done
        exit 0
      description: Retire legacy ~/.codex/skills links
    # grok is the one harness whose config must be a REAL FILE: a symlinked
    # ~/.grok/config.toml makes it reject the hooks-paths registry ("wrong type
    # (expected real file)") and rewrite the path, which is how the repo copy
    # and the live file drifted apart. So: drop any old symlink, show what the
    # install would change, then copy. Never `cp` over the symlink — that writes
    # through into the repo working tree. Keys grok writes itself (sticky UI
    # state, auth) are NOT merged back automatically: read the printed diff and
    # port anything worth keeping into grok/config.toml by hand.
    - command: |
        mkdir -p "$HOME/.grok"
        dst="$HOME/.grok/config.toml"
        [ -L "$dst" ] && rm "$dst"
        if ! cmp -s grok/config.toml "$dst"; then
          diff -u "$dst" grok/config.toml || true
          cp grok/config.toml "$dst"
        fi
      description: Installing grok config (real copy, not a symlink)
    # Pre-accepts the folder-trust dialog. Claude Code has no global trust
    # setting and permissions.defaultMode does NOT cover it, so the flag has to
    # be written per repo root into the same (non-symlinkable) state file.
    - command: scripts/claude-trust-merge.sh "$HOME/.claude.json" claude/trusted-paths.txt
      description: Pre-accepting folder trust (claude)
    # claude2 identity: skills → the merged ~/.claude/skills real directory.
    # agents is NOT linked here — ~/.claude/agents is created by the private
    # overlay, which runs after this pass and owns the claude2 link too. A
    # public-only machine correctly ends up with no agents for any identity.
    - command: |
        dst="$HOME/.claude2/skills"
        if [ -e "$dst" ] && [ ! -L "$dst" ]; then
          echo "WARN: $dst exists and is not a symlink — resolve manually"
        else
          ln -sfn "$HOME/.claude/skills" "$dst"
        fi
      description: claude2 skills link
    - command: scripts/mcp-merge.sh "$HOME/.claude2/.claude.json" claude/mcpServers.json
      description: Merging MCP servers into claude2
    - command: scripts/claude-trust-merge.sh "$HOME/.claude2/.claude.json" claude/trusted-paths.txt
      description: Pre-accepting folder trust (claude2)
    # agy never read ~/.gemini/antigravity-cli/AGENTS.md — its global root is
    # ~/.gemini/config/. Remove the retired symlink once; everything else in
    # that vendor state directory is left alone.
    - command: |
        dst="$HOME/.gemini/antigravity-cli/AGENTS.md"
        if [ -L "$dst" ]; then rm "$dst" && echo "removed retired agy AGENTS.md link $dst"; fi
      description: Remove retired agy AGENTS.md link
    # agy skills: one directory symlink suffices — unlike ~/.claude/skills this
    # path is not a merge target, so it can point straight at the merged real
    # directory and pick up the private overlay's skills too.
    - command: |
        dst="$HOME/.gemini/config/skills"
        if [ -e "$dst" ] && [ ! -L "$dst" ]; then
          echo "WARN: $dst exists and is not a symlink — resolve manually"
        else
          ln -sfn "$HOME/.claude/skills" "$dst"
        fi
      description: agy skills → merged ~/.claude/skills

# Periodic harness updater. Platform checks keep launchd off Linux and skip
# systemd user units on WSL installations without systemd.
# --- DeepSeek Harness pilot (developer preview, local only) ----------------
# Provision the pinned runtime, then let DSH build its own tree, then link the
# managed files into it. The order below is binding and each step explains why.
- shell:
    - command: |
        set -eu
        prefix="$HOME/.local/share/dsh"
        if ! command -v npm >/dev/null 2>&1; then
          echo "dsh: npm not found - skipping the DeepSeek Harness pilot" >&2
          exit 0
        fi
        mkdir -p "$prefix"
        # COPIED, not linked. npm writes into its project directory, and a
        # symlink here would let it write through into this repo. Same reason
        # grok/config.toml is copied. The diff is shown so a drifted runtime
        # copy is visible at install time rather than silently overwritten.
        for f in .npmrc package.json package-lock.json; do
          if ! cmp -s "deepseek-harness/$f" "$prefix/$f"; then
            diff -u "$prefix/$f" "deepseek-harness/$f" || true
            cp "deepseek-harness/$f" "$prefix/$f"
          fi
        done
        # Fingerprint of the inputs this runtime was LAST SUCCESSFULLY built
        # from. "inputs changed or node_modules missing" is not enough: a failed
        # `npm ci` leaves a partial node_modules behind, and the next install
        # would then see equal inputs plus a present directory and skip the
        # repair forever. The stamp is cleared before the attempt and written
        # only after it succeeds, so an interrupted or failed install always
        # retries.
        stamp="$prefix/.npm-ci-ok"
        if command -v shasum >/dev/null 2>&1; then
          want=$(cat deepseek-harness/.npmrc deepseek-harness/package.json \
            deepseek-harness/package-lock.json | shasum -a 256 | cut -d' ' -f1)
        else
          want=$(cat deepseek-harness/.npmrc deepseek-harness/package.json \
            deepseek-harness/package-lock.json | sha256sum | cut -d' ' -f1)
        fi
        have=$(cat "$stamp" 2>/dev/null || true)
        # `npm ci` installs exactly the locked graph, refuses a package.json
        # that disagrees with the lock, and never rewrites the lock. The
        # lifecycle guard comes from the copied .npmrc, so it does not depend
        # on this machine's ~/.npmrc; the allow/deny decisions come from the
        # copied package.json, which is the only layer where a DENY exists.
        if [ "$have" != "$want" ] || [ ! -d "$prefix/node_modules" ]; then
          rm -f "$stamp"
          (cd "$prefix" && npm ci)
          printf '%s\n' "$want" >"$stamp"
        fi
      description: Installing the pinned DeepSeek Harness runtime
      stdout: true
      stderr: true
    - command: |
        set -eu
        prefix="$HOME/.local/share/dsh-pnpm"
        command -v npm >/dev/null 2>&1 || exit 0
        # A SEPARATE prefix on purpose. `dsh plugin` shells out to pnpm, and a
        # profile-local install is the only shape that keeps one @deepseek-ai
        # plane: npm resolves the TUI's optional peers against the tree and
        # pulls a second, older plane into the profile, while pnpm with the
        # shipped `autoInstallPeers: false` pulls none. So pnpm is a hard
        # prerequisite, and it is pinned here rather than added to the official
        # runtime project, whose package/lock/lifecycle set must stay
        # byte-identical to the evidence it was gated against.
        mkdir -p "$prefix"
        for f in .npmrc package.json package-lock.json; do
          if ! cmp -s "deepseek-harness/pnpm/$f" "$prefix/$f"; then
            diff -u "$prefix/$f" "deepseek-harness/pnpm/$f" || true
            cp "deepseek-harness/pnpm/$f" "$prefix/$f"
          fi
        done
        stamp="$prefix/.npm-ci-ok"
        if command -v shasum >/dev/null 2>&1; then
          want=$(cat deepseek-harness/pnpm/.npmrc deepseek-harness/pnpm/package.json \
            deepseek-harness/pnpm/package-lock.json | shasum -a 256 | cut -d' ' -f1)
        else
          want=$(cat deepseek-harness/pnpm/.npmrc deepseek-harness/pnpm/package.json \
            deepseek-harness/pnpm/package-lock.json | sha256sum | cut -d' ' -f1)
        fi
        have=$(cat "$stamp" 2>/dev/null || true)
        # pnpm's own lifecycle scripts are DENIED in the tracked package.json.
        # They exist to swap the shipped shebang-less placeholder for the native
        # binary; pnpm's install.js documents that when scripts are blocked the
        # placeholder stays and `bin/pnpm.mjs` runs the same native binary, which
        # arrives as the locked optional dependency rather than a download. That
        # is the entry point Corepack uses for the same reason, so nothing is
        # lost by denying them.
        if [ "$have" != "$want" ] || [ ! -d "$prefix/node_modules" ]; then
          rm -f "$stamp"
          (cd "$prefix" && npm ci)
          printf '%s\n' "$want" >"$stamp"
        fi
        # Denying the lifecycle scripts also means npm creates no
        # node_modules/.bin/pnpm, so this generated shim is what `dsh plugin`
        # finds when bin/dsh puts this one directory on PATH for that single
        # invocation. Generated rather than tracked: it carries no version or
        # integrity of its own, it is pure indirection onto the entry point of
        # whatever the lock resolved, and an executable in the repo that ends up
        # on PATH is a thing to avoid when it buys nothing.
        # Written with printf, not a heredoc: a heredoc body would have to sit
        # at column 0 to keep the shebang there, and column 0 ends this YAML
        # block scalar.
        mkdir -p "$prefix/bin"
        # Every $-expression below is the SHIM's, resolved when the shim runs,
        # so it has to reach the file literally.
        # shellcheck disable=SC2016
        {
          printf '#!/bin/sh\n'
          printf '# Generated by ./install - see install.conf.yaml. Not tracked.\n'
          printf '#\n'
          printf '# bin/pnpm.mjs is the entry point pnpm documents for installs whose\n'
          printf '# lifecycle scripts were blocked (Corepack uses the same one); it runs\n'
          printf '# the native binary that arrived as a locked optional dependency, so the\n'
          printf '# exact pnpm here is the one deepseek-harness/pnpm/package-lock.json\n'
          printf '# pins and hashes.\n'
          printf 'set -eu\n'
          printf 'here=$(CDPATH=%s cd -- "$(dirname -- "$0")" && pwd -P)\n' "''"
          printf 'exec node "$here/../node_modules/pnpm/bin/pnpm.mjs" "$@"\n'
        } >"$prefix/bin/pnpm"
        chmod +x "$prefix/bin/pnpm"
      description: Installing the pinned pnpm the DSH profile installer needs
      stdout: true
      stderr: true
    - command: |
        set -eu
        bin="$HOME/.local/share/dsh/node_modules/.bin/dsh"
        [ -x "$bin" ] || exit 0
        # First run materializes ~/.dsh/profiles/web. Copying into it before
        # this point would create a plain directory where DSH needs its own
        # tree. --dump-config composes the profile without serving anything.
        DSH_HOME="$HOME/.dsh" "$bin" --profile web --dump-config >/dev/null
        if [ ! -d "$HOME/.dsh/profiles/web" ]; then
          echo "dsh: ~/.dsh/profiles/web was not created - refusing to write into it" >&2
          exit 1
        fi
      description: Initializing the DeepSeek Harness web profile
      stderr: true
    - command: |
        set -eu
        pnpm_entry="$HOME/.local/share/dsh-pnpm/node_modules/pnpm/bin/pnpm.mjs"
        profile="$HOME/.dsh/profiles/dsh-tui"
        tracked=deepseek-harness/profiles/dsh-tui
        [ -x "$HOME/.local/share/dsh/node_modules/.bin/dsh" ] || exit 0
        if [ ! -f "$pnpm_entry" ]; then
          echo "dsh: pinned pnpm missing - skipping the dsh-tui profile" >&2
          exit 0
        fi
        # `dsh-tui` is NOT a shipped profile template, so nothing materializes
        # it the way --dump-config materializes `web`. It is provisioned here
        # from its three tracked install inputs and then installed from its own
        # lock. COPIED, never linked: pnpm writes into this directory.
        mkdir -p "$profile"
        for f in package.json pnpm-workspace.yaml pnpm-lock.yaml; do
          if ! cmp -s "$tracked/$f" "$profile/$f"; then
            diff -u "$profile/$f" "$tracked/$f" || true
            cp "$tracked/$f" "$profile/$f"
          fi
        done
        stamp="$profile/.pnpm-install-ok"
        if command -v shasum >/dev/null 2>&1; then
          want=$(cat "$tracked/package.json" "$tracked/pnpm-workspace.yaml" \
            "$tracked/pnpm-lock.yaml" | shasum -a 256 | cut -d' ' -f1)
        else
          want=$(cat "$tracked/package.json" "$tracked/pnpm-workspace.yaml" \
            "$tracked/pnpm-lock.yaml" | sha256sum | cut -d' ' -f1)
        fi
        have=$(cat "$stamp" 2>/dev/null || true)
        # --frozen-lockfile is the pnpm equivalent of `npm ci`: it installs
        # exactly the locked graph and fails rather than rewriting the lock.
        # `autoInstallPeers: false` from the tracked pnpm-workspace.yaml is what
        # keeps the TUI's unsatisfiable @deepseek-ai peer ranges from pulling a
        # second plane in here; never relax it to silence a peer warning.
        # The pinned pnpm is reached by absolute path, so it never joins PATH.
        if [ "$have" != "$want" ] || [ ! -d "$profile/node_modules" ]; then
          rm -f "$stamp"
          (cd "$profile" && node "$pnpm_entry" install --frozen-lockfile)
          printf '%s\n' "$want" >"$stamp"
        fi
        # The whole point of the profile-local install. A single @deepseek-ai
        # package here is a split singleton: two Cordis/plugin class identities
        # in one process, double registration, and failures that look like
        # anything but a packaging problem.
        if [ -n "$(find "$profile/node_modules" -type d -name '@deepseek-ai' -print 2>/dev/null | head -n 1)" ]; then
          echo "dsh: $profile/node_modules contains @deepseek-ai packages - second plane, refusing" >&2
          exit 1
        fi
      description: Provisioning the managed DeepSeek Harness dsh-tui profile
      stdout: true
      stderr: true
    - command: |
        set -eu
        profile="$HOME/.dsh/profiles/web"
        preset="$HOME/.dsh/.agent-presets/dotfiles"
        tracked="deepseek-harness/presets/dotfiles"
        # The runtime prefix is where the pinned js-yaml lives; the patch-layer
        # check below parses with the loader's own parser, not a lookalike.
        prefix="$HOME/.local/share/dsh"
        [ -d "$profile" ] || exit 0

        # Managed COPIES, never symlinks — the same rule the npm inputs follow.
        # A symlink here aims the harness at this working tree, so anything that
        # writes through it (the Web UI's own edit surfaces, a future
        # copy-a-preset call, a half-written file) lands in the repo. `cp` onto
        # a symlink writes THROUGH it, which is why an existing link is removed
        # rather than overwritten. Drift is shown before it is replaced, so a
        # hand-edited runtime copy is visible at install time instead of
        # vanishing silently.
        #
        # The write is atomic: a temp file in the SAME directory, then mv, so
        # the rename is a single filesystem operation. `patchReload: live` means
        # DSH watches these patch files and recomposes the running tree when one
        # changes, so a plain `cp` can hand the watcher a half-written YAML
        # document. Same-directory is what makes mv a rename rather than a
        # copy-and-truncate.
        install_copy() {
          if [ -L "$2" ]; then
            echo "dsh: replacing the symlink at $2 with a managed copy" >&2
            rm -f "$2"
          elif [ -e "$2" ] && [ ! -f "$2" ]; then
            # A directory (or fifo, or device) where a file belongs. `mv` would
            # move the temp file INSIDE a directory and report success, leaving
            # the managed file uninstalled and the installer claiming it worked.
            echo "dsh: $2 exists and is not a regular file - remove it and re-run ./install" >&2
            exit 1
          elif [ -f "$2" ] && cmp -s "$1" "$2"; then
            # Already correct. Return WITHOUT writing: patchReload is live, so
            # replacing an identical file still makes DSH recompose a running
            # tree, and ./install would do that on every single run.
            return 0
          elif [ -f "$2" ]; then
            diff -u "$2" "$1" || true
          fi
          case $2 in
          */*) tmp="${2%/*}/.dsh-install.$$.tmp" ;;
          *) tmp="./.dsh-install.$$.tmp" ;;
          esac
          cp "$1" "$tmp"
          mv -f "$tmp" "$2"
        }

        # The model route is one file for every profile. `composeProfile` loads
        # $DSH_HOME/cordis.patch.yml for each profile it boots and applies it
        # after that profile's own layer, so `web`, `dsh-tui` and `headless` all
        # get the route from here and nothing has to be kept in sync.
        #
        # A patch layer must PARSE as a top-level YAML sequence. Anything else
        # is silently wrong rather than loudly broken: a comment-only or
        # truncated file parses as null and the loader treats the layer as
        # absent, so every profile boots unrouted with no error, and a scalar or
        # a map would reroute or break composition instead. Text inspection
        # cannot tell any of those apart, so parse with the loader's OWN parser
        # and its OWN dialect before replacing a working file:
        # cordis-plugin-include exports `entryListSchema` for exactly this, so
        # this check accepts and rejects precisely what a boot would. Rebuilding
        # the schema by hand would be a lookalike - the dialect is JSON_SCHEMA
        # plus one scalar `!!js` tag, which is stricter than js-yaml's default.
        #
        # An empty sequence is allowed because it can only be written as the
        # literal `[]`; that is a deliberate "no rows", not an accident.
        #
        # The parser comes from the installed runtime, so a machine that has no
        # runtime yet has no parser either. That is a SKIP with a visible line,
        # not a failure: there is no harness on such a machine to protect, the
        # tracked files' shape is asserted offline by
        # tests/test-deepseek-harness.sh, and failing here would make ./install
        # depend on an install step that may have been skipped.
        check_patch_layer() {
          node -e '
            const { createRequire } = require("node:module")
            const fs = require("node:fs")
            let yaml, schema
            try {
              const req = createRequire(process.argv[1] + "/package.json")
              yaml = req("js-yaml")
              schema = req("@deepseek-ai/cordis-plugin-include").entryListSchema
              if (!schema) throw new Error("entryListSchema is not exported")
            } catch {
              console.error("dsh: no installed runtime at " + process.argv[1] + " -")
              console.error("dsh: skipping the patch-layer parse check for " + process.argv[2])
              process.exit(0)
            }
            let doc
            try {
              doc = yaml.load(fs.readFileSync(process.argv[2], "utf8"), { schema })
            } catch (error) {
              console.error("dsh: " + process.argv[2] + " is not valid YAML: " + error.message)
              process.exit(1)
            }
            if (Array.isArray(doc)) process.exit(0)
            const got = doc === null || doc === undefined ? "no entries"
              : typeof doc === "object" ? "a map" : "a " + typeof doc
            console.error("dsh: " + process.argv[2] + " must be a top-level list of patch entries, got " + got)
            console.error("dsh: a deliberately empty layer must be the literal []")
            process.exit(1)
          ' "$prefix" "$1"
        }

        home_patch=deepseek-harness/cordis.patch.yml
        for f in "$home_patch" deepseek-harness/profiles/web/cordis.patch.yml \
          deepseek-harness/profiles/dsh-tui/cordis.patch.yml; do
          check_patch_layer "$f"
        done

        install_copy "$home_patch" "$HOME/.dsh/cordis.patch.yml"

        # Per-profile layers carry only what that profile's composition
        # actually has a row for. The preset roster id differs between the two
        # surfaces, which is why this is not one shared file.
        install_copy deepseek-harness/profiles/web/cordis.patch.yml \
          "$profile/cordis.patch.yml"

        # The terminal profile's own layer. Its roster row carries the bundle's
        # scoped `dsh-tui-agent-presets` id, not `agent-presets`, so the two
        # files are not interchangeable. Provisioned by the previous step; if
        # that skipped, there is nothing to patch.
        if [ -d "$HOME/.dsh/profiles/dsh-tui" ]; then
          install_copy deepseek-harness/profiles/dsh-tui/cordis.patch.yml \
            "$HOME/.dsh/profiles/dsh-tui/cordis.patch.yml"
        fi

        if [ -L "$preset" ]; then
          echo "dsh: replacing the symlink at $preset with a managed copy" >&2
          rm -f "$preset"
        fi
        mkdir -p "$preset"
        # The copier is deliberately flat, so say so instead of silently
        # flattening a preset that grows a subdirectory.
        if [ -n "$(find "$tracked" -mindepth 1 -type d -print 2>/dev/null | head -n 1)" ]; then
          echo "dsh: $tracked has a subdirectory - this copier is flat" >&2
          exit 1
        fi
        # A preset is a composition DSH scans whole, so a leftover file from an
        # older revision is not inert: mirror it, do not merely add to it.
        find "$tracked" -type f | while IFS= read -r src; do
          install_copy "$src" "$preset/${src##*/}"
        done
        find "$preset" -type f | while IFS= read -r dst; do
          if [ ! -f "$tracked/${dst##*/}" ]; then
            echo "dsh: removing $dst - no longer part of the managed preset" >&2
            rm -f "$dst"
          fi
        done
      description: Installing the managed DeepSeek Harness patch and preset
      stdout: true
      stderr: true

- create:
    - ~/.local/state/harness-update
- link:
    ~/Library/LaunchAgents/at.clemens.harness-update.plist:
      path: macos/LaunchAgents/at.clemens.harness-update.plist
      if: '[ "$(uname -s)" = "Darwin" ]'
    ~/.config/systemd/user/harness-update.service:
      path: linux/systemd/harness-update.service
      if: '[ "$(uname -s)" = "Linux" ] && [ -d /run/systemd/system ]'
    ~/.config/systemd/user/harness-update.timer:
      path: linux/systemd/harness-update.timer
      if: '[ "$(uname -s)" = "Linux" ] && [ -d /run/systemd/system ]'

# Activate or reload the scheduler after its platform-specific files are linked.
- shell:
    - command: |
        if [ "$(uname -s)" = "Darwin" ]; then
          launchctl bootout "gui/$(id -u)/at.clemens.harness-update" 2>/dev/null || true
          launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/at.clemens.harness-update.plist"
        fi
      description: Loading harness updater (launchd)
    - command: |
        if [ "$(uname -s)" = "Linux" ] && [ -d /run/systemd/system ]; then
          systemctl --user daemon-reload && systemctl --user enable --now harness-update.timer
        fi
      description: Loading harness updater (systemd)
