# Codex skills — same per-skill pattern
- link:
    ~/.codex/skills/adr: skills/adr
    ~/.codex/skills/arch-docs: skills/arch-docs
    ~/.codex/skills/caveman: skills/caveman
    ~/.codex/skills/code-review: skills/code-review
    ~/.codex/skills/collab: skills/collab
    ~/.codex/skills/cross-model-review: skills/cross-model-review
    ~/.codex/skills/diagnose: skills/diagnose
    ~/.codex/skills/drawio-diagrams-enhanced: skills/drawio-diagrams-enhanced
    ~/.codex/skills/gha-security-review: skills/gha-security-review
    ~/.codex/skills/grill-with-docs: skills/grill-with-docs
    ~/.codex/skills/humanizer: skills/humanizer
    ~/.codex/skills/improve-codebase-architecture: skills/improve-codebase-architecture
    ~/.codex/skills/large-feature: skills/large-feature
    ~/.codex/skills/manage-skills: skills/manage-skills
    ~/.codex/skills/quiz-diff: skills/quiz-diff
