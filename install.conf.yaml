    ~/.claude/skills/arch-docs: skills/arch-docs
    ~/.claude/skills/caveman: skills/caveman
    ~/.claude/skills/code-review: skills/code-review
    ~/.claude/skills/collab: skills/collab
    ~/.claude/skills/cross-model-review: skills/cross-model-review
    ~/.claude/skills/diagnose: skills/diagnose
