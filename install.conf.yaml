- defaults:
    link:
      relink: true
      create: true

# ~/.config/opencode: retires the dead OpenCode 1 config.json/tui.json links.
- clean: ["~", "~/.config/opencode"]

- create:
    - ~/.vim/undo-history
    - ~/.claude
    - ~/.claude/skills
    - ~/.codex
    # Codex user-scope skills live in ~/.agents/skills (CX-SKILL); ~/.codex/skills
    # is legacy and Codex creates its own .system dir there — not managed here.
    - ~/.agents/skills
    - ~/.config/fish
    - ~/.config/open-design
    - ~/.config/opencode
    - ~/.gemini
    # agy's real global customization root (~/.gemini/antigravity-cli/ is the
    # vendor state dir, not a discovery path).
    - ~/.gemini/config

# Shell / editor / git / terminal links (portable: WSL + macOS)
- link:
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.gitconfig: gitconfig
    ~/.bash_aliases: bash_aliases
    ~/.config/fish/config.fish: config.fish
    ~/.config/fish/functions: fish/functions
    ~/.config/fish/conf.d/uv.env.fish: fish/conf.d/uv.env.fish
    ~/.config/fish/conf.d/codex-ca.fish: fish/conf.d/codex-ca.fish
    # Public CA root that macOS does not ship yet — see codex-ca.fish for why.
    ~/.config/ca/isrg-root-yr.pem: certs/isrg-root-yr.pem
    # Ghostty reads this path on macOS AND Linux — harmless where unused.
    ~/.config/ghostty/config: terminal/ghostty.config
    # Cargo global config (aliases; sccache toggle). ~/.cargo itself is
    # rustup-owned — only this one file is managed here. Safe to link: cargo
    # never rewrites it. No-op harm on machines without rust.
    ~/.cargo/config.toml: rust/cargo-config.toml
    ~/.config/open-design/compose.yaml: open-design/compose.yaml
    # The service image is a thin local derivative of the pinned upstream image,
    # so the Dockerfile is a required input: `open-design build` reads it from
    # this directory and feeds it to docker on stdin with no build context at
    # all, because a build context does not follow this symlink.
    ~/.config/open-design/Dockerfile: open-design/Dockerfile
    ~/.local/bin/open-design: bin/open-design
    ~/.local/bin/open-design-mcp: bin/open-design
    # Job count for parallel test/build runs from the CPU free right now.
    ~/.local/bin/jobs-budget: bin/jobs-budget
    # Karabiner (macOS only; the dir simply stays unused elsewhere). NOTE: this
    # links the importable RULE SET, not karabiner.json — Karabiner rewrites
    # karabiner.json itself on device connect, so symlinking it would fight the
    # app. Activate after a rebuild: Karabiner-Elements → Complex Modifications
    # → Add rule → "Windows-style layout". See karabiner/README.md.
    ~/.config/karabiner/assets/complex_modifications/windows-layout.json: karabiner/assets/complex_modifications/windows-layout.json

# AI tool instructions — NOT linked. The contract is RENDERED: shared/AGENTS.md
# plus the private overlay's AGENTS-MIC.md are concatenated into one regular
# file per harness by the scripts/render-contract.sh step in the shell block
# below. Measured 2026-09-09: only Claude Code reads a marker file one level
# above a git root, so directory-scoped org rules are not portable and
# concatenation is the only cross-harness way to add them.
#
# agy discovers global customizations under ~/.gemini/config/ only, and the
# contract ships as the rules half of a plugin — plugin.json is the marker that
# makes the directory a plugin, its rules/AGENTS.md sibling is rendered.
- link:
    ~/.gemini/config/plugins/dotfiles/plugin.json:
      path: antigravity/plugin/plugin.json
      force: true

# AI tool settings + MCP configs
- link:
    ~/.claude/settings.json:
      path: claude/settings.json
      force: true
    ~/.claude/statusline.sh:
      path: claude/statusline.sh
      force: true
    ~/.claude/hooks/timestamp-display.sh:
      path: claude/hooks/timestamp-display.sh
      force: true
    ~/.codex/config.toml:
      path: codex/config.toml
      force: true
    # OpenCode 2 reads only opencode.json(c). Its terminal settings live in
    # ~/.config/opencode/cli.json, which the TUI itself writes (Ctrl+P ->
    # settings), so that file is left unmanaged rather than linked into the repo.
    ~/.config/opencode/opencode.jsonc:
      path: opencode/opencode.jsonc
      force: true
    ~/.gemini/antigravity-cli/settings.json:
      path: antigravity/settings.json
      force: true
    ~/.grok/AGENTS.md:
      path: grok/AGENTS.md
      force: true

# Additional Claude Code identity (`claude-p` fish function
# sets CLAUDE_CONFIG_DIR) — isolated login per config dir (macOS: own Keychain
# entry keyed off the dir path; Linux: per-identity .credentials.json) while
# sharing all config with ~/.claude.
# skills/agents dir symlinks + MCP merge happen in the shell block below
# (targets live in $HOME, not the repo). CLAUDE.md is rendered there too, not
# linked. NOT linked (rewritten per identity): .claude.json,
# settings.local.json, projects/, history.
- create:
    - ~/.claude-p
- link:
    ~/.claude-p/settings.json:
      path: claude/settings.json
      force: true
    ~/.claude-p/statusline.sh:
      path: claude/statusline.sh
      force: true
    ~/.claude-p/hooks/timestamp-display.sh:
      path: claude/hooks/timestamp-display.sh
      force: true

# Claude Code skills — per-skill symlinks (not a directory symlink, so the private
# overlay can contribute its own skills into the same target directory).
- link:
    ~/.claude/skills/adr: skills/adr
    ~/.claude/skills/arch-docs: skills/arch-docs
    ~/.claude/skills/caveman: skills/caveman
    ~/.claude/skills/catch-up: skills/catch-up
    ~/.claude/skills/code-review: skills/code-review
    ~/.claude/skills/collab: skills/collab
    ~/.claude/skills/cross-model-review: skills/cross-model-review
    ~/.claude/skills/diagnose: skills/diagnose
    ~/.claude/skills/gcp-operations: skills/gcp-operations
    ~/.claude/skills/gha-security-review: skills/gha-security-review
    ~/.claude/skills/grill-with-docs: skills/grill-with-docs
    ~/.claude/skills/large-feature: skills/large-feature
    ~/.claude/skills/manage-skills: skills/manage-skills
    ~/.claude/skills/refactor-audit: skills/refactor-audit
    ~/.claude/skills/scope: skills/scope
    ~/.claude/skills/security-review: skills/security-review
    ~/.claude/skills/tdd: skills/tdd
    ~/.claude/skills/test-audit: skills/test-audit
    ~/.claude/skills/viz: skills/viz

# Codex skills — same per-skill pattern. The documented user scope is
# ~/.agents/skills; ~/.codex/skills is legacy (and holds Codex's own .system
# directory, which is never managed here). Same-name skills are NOT merged
# across scopes, so the links live in exactly one root.
- link:
    ~/.agents/skills/adr: skills/adr
    ~/.agents/skills/arch-docs: skills/arch-docs
    ~/.agents/skills/caveman: skills/caveman
    ~/.agents/skills/catch-up: skills/catch-up
    ~/.agents/skills/code-review: skills/code-review
    ~/.agents/skills/collab: skills/collab
    ~/.agents/skills/cross-model-review: skills/cross-model-review
    ~/.agents/skills/diagnose: skills/diagnose
    ~/.agents/skills/gcp-operations: skills/gcp-operations
    ~/.agents/skills/gha-security-review: skills/gha-security-review
    ~/.agents/skills/grill-with-docs: skills/grill-with-docs
    ~/.agents/skills/large-feature: skills/large-feature
    ~/.agents/skills/manage-skills: skills/manage-skills
    ~/.agents/skills/refactor-audit: skills/refactor-audit
    ~/.agents/skills/scope: skills/scope
    ~/.agents/skills/security-review: skills/security-review
    ~/.agents/skills/tdd: skills/tdd
    ~/.agents/skills/test-audit: skills/test-audit
    ~/.agents/skills/viz: skills/viz

- shell:
    - command: mkdir -p ~/.config/fish
      description: Ensure fish config dir
    # The contract, concatenated and written as a REGULAR file per harness. Runs
    # after the create/link steps because it needs the identity directories to
    # exist — it renders only into identities a machine actually has, and never
    # creates one. The six targets used to be symlinks into this repo, so the
    # renderer unlinks before it moves a file into place; writing through one
    # would truncate shared/AGENTS.md. ~/.claude-mic belongs to the overlay pass,
    # which runs this same script again once that identity exists. Idempotent:
    # an unchanged target is not even rewritten.
    # Copilot supports COPILOT_HOME; provision only that resolved native home.
    - command: mkdir -p "${COPILOT_HOME:-$HOME/.copilot}"
      description: Creating native Copilot instruction and MCP home
    - command: scripts/render-contract.sh
      description: Rendering the AI contract (shared + private addendum)
      stdout: true
    # Migration (2026-08-11): codex features.shell_snapshot dumped the inherited
    # environment — secrets included — into world-readable snapshot scripts.
    # The feature is now off in codex/config.toml; purge any legacy snapshots.
    - command: |
        dir="$HOME/.codex/shell_snapshots"
        if [ -L "$dir" ]; then
          # -d follows symlinks; deleting through one would hit an unrelated
          # target. Only ever purge the real cache dir codex owns.
          echo "WARN: $dir is a symlink — refusing to purge, resolve manually"
        elif [ -d "$dir" ]; then
          n=$(ls "$dir" 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" -gt 0 ]; then
            rm -f "$dir"/* && echo "purged $n legacy codex shell snapshot(s) (may contain secrets)"
          fi
        fi
      description: Purge legacy codex shell snapshots
    - command: scripts/copilot-mcp-merge.sh "${COPILOT_HOME:-$HOME/.copilot}/mcp-config.json" claude/mcpServers.json
      description: Reconciling native Copilot public MCP servers
    # Native key-only edit; auth/config.json and other preferences stay CLI-owned.
    # Positive shim check only. A resolved copilot-shim path is absent. Anything
    # not proved a shim (bare name, broken link, loop) keeps command -v behaviour.
    # Do not execute the candidate to detect it.
    - command: |
        copilot_is_shim() {
          cmd=$(command -v copilot 2>/dev/null) || return 1
          case "$cmd" in
            */*) target=$cmd ;;
            *) return 1 ;;
          esac
          n=0
          while [ -L "$target" ]; do
            n=$((n + 1))
            [ "$n" -le 32 ] || return 1
            link=$(readlink "$target") || return 1
            case "$link" in
              /*) target=$link ;;
              *) target=$(dirname "$target")/$link ;;
            esac
          done
          dir=$(dirname "$target")
          base=$(basename "$target")
          dir=$(CDPATH= cd -- "$dir" 2>/dev/null && pwd -P) || return 1
          case "$dir/$base" in
            *copilot-shim*) return 0 ;;
          esac
          return 1
        }
        if command -v copilot >/dev/null 2>&1 && ! copilot_is_shim; then
          copilot config includeCoAuthoredBy false || exit 1
          dir="$HOME/.local/state/harness-update"
          mkdir -p "$dir" || exit 1
          marker=$(mktemp "$dir/.copilot-installed.XXXXXX") || exit 1
          trap 'rm -f "$marker"' EXIT HUP INT TERM
          printf 'installed\n' >"$marker" && chmod 600 "$marker" && mv "$marker" "$dir/copilot-installed" || exit 1
        else
          echo "Copilot CLI absent; native attribution setting skipped"
        fi
      description: Disabling Copilot commit attribution and recording installed state
    - command: scripts/mcp-merge.sh "$HOME/.claude.json" claude/mcpServers.json
      description: Merging Claude Code MCP servers
    # Muse rewrites settings.json itself (/model, /effort, and TUI state), so
    # this must stay a merge into a real file. Repo keys win; unknown runtime
    # keys survive; the shared Claude-style MCP source is installed verbatim.
    - command: scripts/muse-settings-merge.sh "$HOME/.config/muse/settings.json" muse/settings.json claude/mcpServers.json
      description: Merging Muse settings and MCP servers
    # Migration (2026-09-07): Codex user skills moved to ~/.agents/skills. The
    # legacy root still exists on hosts installed before this change, Codex
    # scans both, and a link there wins — so a skill deleted or renamed here
    # would keep shadowing the new root. Remove OUR links only: a symlink whose
    # recorded target points into this checkout's skills tree (either layer —
    # the wrapper always runs the public pass from the repo root, so one step
    # covers the overlay too). Never touch .system, real directories, or links
    # into anything else, and match the recorded target so links left dangling
    # by a rename are cleaned up as well.
    - command: |
        dir="$HOME/.codex/skills"
        [ -d "$dir" ] || exit 0
        find "$dir" -maxdepth 1 -type l -print | while IFS= read -r link; do
          case "$(readlink "$link")" in
            "$PWD"/skills/*|"$PWD"/dotfiles-mic/skills/*)
              rm "$link" && echo "retired legacy codex skill link ${link##*/} (now served from ~/.agents/skills)" ;;
          esac
        done
        exit 0
      description: Retire legacy ~/.codex/skills links
    # grok is the one harness whose config must be a REAL FILE: a symlinked
    # ~/.grok/config.toml makes it reject the hooks-paths registry ("wrong type
    # (expected real file)") and rewrite the path, which is how the repo copy
    # and the live file drifted apart. So: drop any old symlink, show what the
    # install would change, then copy. Never `cp` over the symlink — that writes
    # through into the repo working tree. Keys grok writes itself (sticky UI
    # state, auth) are NOT merged back automatically: read the printed diff and
    # port anything worth keeping into grok/config.toml by hand.
    - command: |
        mkdir -p "$HOME/.grok"
        dst="$HOME/.grok/config.toml"
        [ -L "$dst" ] && rm "$dst"
        if ! cmp -s grok/config.toml "$dst"; then
          diff -u "$dst" grok/config.toml || true
          cp grok/config.toml "$dst"
        fi
      description: Installing grok config (real copy, not a symlink)
    # Pre-accepts the folder-trust dialog. Claude Code has no global trust
    # setting and permissions.defaultMode does NOT cover it, so the flag has to
    # be written per repo root into the same (non-symlinkable) state file.
    - command: scripts/claude-trust-merge.sh "$HOME/.claude.json" claude/trusted-paths.txt
      description: Pre-accepting folder trust (claude)
    # claude-p identity: skills → the merged ~/.claude/skills real directory.
    # agents is NOT linked here — ~/.claude/agents is created by the private
    # overlay, which runs after this pass and owns the identity link too. A
    # public-only machine correctly ends up with no agents for any identity.
    - command: |
        dst="$HOME/.claude-p/skills"
        if [ -e "$dst" ] && [ ! -L "$dst" ]; then
          echo "WARN: $dst exists and is not a symlink — resolve manually"
        else
          ln -sfn "$HOME/.claude/skills" "$dst"
        fi
      description: claude-p skills link
    - command: scripts/mcp-merge.sh "$HOME/.claude-p/.claude.json" claude/mcpServers.json
      description: Merging MCP servers into claude-p
    - command: scripts/claude-trust-merge.sh "$HOME/.claude-p/.claude.json" claude/trusted-paths.txt
      description: Pre-accepting folder trust (claude-p)
    # agy never read ~/.gemini/antigravity-cli/AGENTS.md — its global root is
    # ~/.gemini/config/. Remove the retired symlink once; everything else in
    # that vendor state directory is left alone.
    - command: |
        dst="$HOME/.gemini/antigravity-cli/AGENTS.md"
        if [ -L "$dst" ]; then rm "$dst" && echo "removed retired agy AGENTS.md link $dst"; fi
      description: Remove retired agy AGENTS.md link
    # The DeepSeek Harness pilot is retired. Remove only a launcher symlink
    # whose target is this repo's bin/dsh. Leave a real file, any other
    # target, ~/.dsh, and ~/.local/share/dsh* for the operator to remove.
    - command: |
        dst="$HOME/.local/bin/dsh"
        if [ -L "$dst" ]; then
          link=$(readlink "$dst") || link=
          if [ -n "$link" ]; then
            case "$link" in
              /*) raw=$link ;;
              *) raw=$(dirname "$dst")/$link ;;
            esac
            raw_dir=$(dirname "$raw")
            raw_base=$(basename "$raw")
            raw_dir=$(CDPATH= cd -- "$raw_dir" 2>/dev/null && pwd -P) || raw_dir=
            repo_bin=$(CDPATH= cd -- bin 2>/dev/null && pwd -P) || repo_bin=
            if [ -n "$raw_dir" ] && [ -n "$repo_bin" ] && [ "$raw_dir/$raw_base" = "$repo_bin/dsh" ]; then
              rm "$dst" && echo "removed retired dsh launcher $dst"
            fi
          fi
        fi
      description: Remove retired dsh launcher link
    # agy skills: one directory symlink suffices — unlike ~/.claude/skills this
    # path is not a merge target, so it can point straight at the merged real
    # directory and pick up the private overlay's skills too.
    - command: |
        dst="$HOME/.gemini/config/skills"
        if [ -e "$dst" ] && [ ! -L "$dst" ]; then
          echo "WARN: $dst exists and is not a symlink — resolve manually"
        else
          ln -sfn "$HOME/.claude/skills" "$dst"
        fi
      description: agy skills → merged ~/.claude/skills

# Periodic harness updater. Platform checks keep launchd off Linux and skip
# systemd user units on WSL installations without systemd.
- create:
    - ~/.local/state/harness-update
- link:
    ~/Library/LaunchAgents/at.clemens.harness-update.plist:
      path: macos/LaunchAgents/at.clemens.harness-update.plist
      if: '[ "$(uname -s)" = "Darwin" ]'
    ~/.config/systemd/user/harness-update.service:
      path: linux/systemd/harness-update.service
      if: '[ "$(uname -s)" = "Linux" ] && [ -d /run/systemd/system ]'
    ~/.config/systemd/user/harness-update.timer:
      path: linux/systemd/harness-update.timer
      if: '[ "$(uname -s)" = "Linux" ] && [ -d /run/systemd/system ]'
    # Ptyxis (Ubuntu's default terminal) Darcula palette; macOS has no Ptyxis.
    ~/.local/share/org.gnome.Ptyxis/palettes/Darcula.palette:
      path: terminal/Darcula.palette
      if: '[ "$(uname -s)" = "Linux" ]'

# Activate or reload the scheduler after its platform-specific files are linked.
- shell:
    - command: |
        if [ "$(uname -s)" = "Darwin" ]; then
          launchctl bootout "gui/$(id -u)/at.clemens.harness-update" 2>/dev/null || true
          launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/at.clemens.harness-update.plist"
        fi
      description: Loading harness updater (launchd)
    - command: |
        if [ "$(uname -s)" = "Linux" ] && [ -d /run/systemd/system ]; then
          systemctl --user daemon-reload && systemctl --user enable --now harness-update.timer
        fi
      description: Loading harness updater (systemd)
