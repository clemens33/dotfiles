model = "gpt-5.6-sol"
personality = "pragmatic"
# GPT-5.6 Sol efforts: low/medium/high/xhigh/max/ultra (ultra = auto subagent
# delegation, Pro/Business-only). OpenAI's default is medium ("Sol is highly
# capable at lower reasoning efforts"); xhigh = deep-by-default, mirrors the
# Claude Code effortLevel. Drop to high/medium via /effort to conserve quota;
# max/ultra stay as per-task escalation.
model_reasoning_effort = "xhigh"
# Plan mode benefits from deeper reasoning than execution.
plan_mode_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
suppress_unstable_features_warning = true
tool_output_token_limit = 25000
# Compact at ~80% of the CLI's ACTIVE window. CLI 0.149.1's model catalog
# gives GPT-5.6 272k active input — the 372k figure is the Codex App's, not
# the CLI's, and the previous 332000 sat ABOVE the ceiling so auto-compaction
# never fired before the hard limit. 220000 leaves ~50k headroom so the
# compaction call never races the limit mid-turn (ruling 2026-08-25:
# deliberate earlier compaction; unset would give ~244800 model default).
# Do NOT also set model_context_window — openai/codex#16068: it resets the
# token counter and silently breaks auto-compaction.
model_auto_compact_token_limit = 220000
project_doc_fallback_filenames = ["CLAUDE.md"]
service_tier = "default"

[features]
unified_exec = true
apply_patch_freeform = true
# OFF on purpose (2026-08-11, found during cross-model review remediation):
# shell_snapshot dumps codex's inherited environment — secrets included — as
# literal `export` lines into world-readable ~/.codex/shell_snapshots/*.sh,
# and every spawned shell re-sources them, defeating shell_environment_policy
# below. 24 of 25 snapshots on this machine contained the MIC gateway keys.
# Re-enable only if codex learns to filter snapshots through the env policy.
shell_snapshot = false

[analytics]
# Disable anonymous telemetry to OpenAI
enabled = false

[history]
# Cap ~/.codex/history.jsonl growth (rollout files under ~/.codex/sessions/
# are NOT cleaned up by Codex itself — see external cron tier 3).
max_bytes = 104857600

# Spawned shell commands inherit codex's FULL environment by default
# (inherit=all + ignore_default_excludes=true, verified in codex source) — and
# sandbox_mode above is full-access. Keep the MIC assistant gateway keys out of
# every command codex runs: they need to exist only in codex's own process env
# for env_http_headers expansion (see [mcp_servers.assistant-all-tools*]).
# Skills that legitimately need a key source ~/.config/<service>/credentials.env
# themselves. Legacy array form on purpose — parsed by all codex versions.
[shell_environment_policy]
exclude = ["MIC_ASSISTANT_*"]

# Trust: suppresses the "do you trust this folder" prompt. Codex has NO global
# trust switch — approval_policy/sandbox_mode above are a SEPARATE system and do
# not silence it — so working roots must be listed per path. Codex appends its
