[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "ide-assistant", "--enable-web-dashboard", "false"]
startup_timeout_sec = 30

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30

# 20s (STRICTER than other servers on purpose): this attaches to an existing
# browser at :9222 and polls for it, so if Chrome isn't up with
# --remote-debugging-port=9222 it burns the whole timeout before failing. Fast-
# fail is better than a long hang. Warm npx + a live browser connect in well
# under 20s; if Chrome is running and this still trips, launch Chrome first.
[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222", "--no-usage-statistics", "--no-performance-crux"]
startup_timeout_sec = 20

# codebase-memory dropped 2026-07-29: trial ended with the mac migration —
# serena covers the need. Binary may linger in ~/.local/bin on WSL; not
# installed on macOS.

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

# MIC AI Assistant gateway (org knowledge/tools). The x-api-key VALUE comes from
# the environment — the private overlay's ~/.local/shims/codex PATH shim injects
# it from ~/.config/mic-assistant/credentials.env into this one process (no
# global export; see dotfiles-mic bin/codex). [shell_environment_policy] above
# keeps it out of spawned shells. No key ever lives in this repo.
#
# ACCEPTED TRADE-OFF on machines WITHOUT the private overlay: codex has no
# config includes, so these defs cannot move to the overlay. With the env vars
# unset, both servers stay `enabled` with a missing header env var, `codex
# doctor` reports an overall warning, and startup logs an auth failure — it does
# NOT break codex or block a session. The alternative (an overlay-owned profile
# + `codex-mic` wrapper via `codex -p`) was judged not worth a second wrapper
# for a cosmetic warning on a machine class that is currently hypothetical.
# Revisit if a real overlay-less machine appears.
[mcp_servers.assistant-all-tools]
url = "https://assistant.ai.miccust.dev/api/gateway/mcp/"
env_http_headers = { "x-api-key" = "MIC_ASSISTANT_API_KEY" }

# Same gateway on the TEST stage — separate key, separate server name so prod
# and test tools never collide in one session.
[mcp_servers.assistant-all-tools-test]
url = "https://assistant-test.ai.miccust.dev/api/gateway/mcp/"
env_http_headers = { "x-api-key" = "MIC_ASSISTANT_TEST_API_KEY" }

[notice]
"hide_gpt-5.1-codex-max_migration_prompt" = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.1-codex-max" = "gpt-5.2-codex"

[tui.model_availability_nux]
"gpt-5.3-codex-spark" = 4
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
