name: open-design

services:
  open-design:
    container_name: open-design
    # Thin local derivative of the digest-pinned upstream image, whose sign-in
    # action cannot run without the Vela CLI; see open-design/Dockerfile. There
    # is deliberately no `build:` stanza: a Docker build context does not follow
    # the Dotbot symlink that puts the Dockerfile beside this file, and widening
    # the context to the dotfiles checkout would ship the whole repo to the
    # daemon. `open-design build` instead builds the COPY-free Dockerfile with no
    # context at all, tagging exactly the name below.
    image: open-design-vela:0.21.1-vela0.0.33
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ""
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_DISABLE_API_AUTH: "1"
      OD_CODEX_SANDBOX: ""
    ports:
      - "127.0.0.1:7456:7456"
    volumes:
      - open_design_data:/app/.od
      # Vela's device-login state lives in $HOME; the daemon reports its config
      # at /home/open-design/.amr/config.json. Keeping it in its own named
      # volume means the sign-in survives restarts and `open-design down`
      # without widening what the OpenDesign data volume holds.
      - open_design_vela_data:/home/open-design
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
  # Credential-bearing: holds an authenticated Vela session. Do not export.
  open_design_vela_data:
