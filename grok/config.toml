# Grok Build (xAI CLI) — installed to ~/.grok/config.toml as a plain COPY by
# dotbot (not a symlink: grok's hooks-paths registry rejects symlinks, so
# `grok --sandbox read-only` refuses to start on one — seen 2026-09-07). This
# repo file is the source of truth; grok also WRITES sticky state into the live
# copy (ui prefs, marketplace flags), so diff live vs repo and merge grok-written
# keys back here BEFORE re-running ./install.
# Skills need no config: Grok natively reads ~/.claude/skills/ (user scope).

[cli]
installer = "internal"
# OFF (2026-09-07, sota-audit L1 #31): scripts/harness-update.sh owns grok
# updates (`grok update`, with timeouts). Two updaters raced; the native one
# hung the daily job 18 min on "GCS channel pointer fetch failed". Vendor's own
# enterprise example (GK-README §Enterprise Deployment) sets this false.
auto_update = false

[models]
# Pin the native model and effort for new sessions.
# Grok 4.7 offers 256k/500k windows; a 500k default is not established here.
# Verify the selected window in the native session header/footer.
default = "grok-4.7"
default_reasoning_effort = "high"

# Candidate only: retain after native subscription/window verification.
[model."grok-4.7"]
context_window = 500000

[features]
# Match codex/claude: no telemetry, no permission prompts (trusted local use).
# NOTE: these flags only silence CLI telemetry/feedback. Training/code-retention
# opt-out is ACCOUNT state, not config: auth.json coding_data_retention_opt_out
# (set via /privacy). Verified 2026-08-14: uploads_enabled=false,
# upload_reason=zdr_team, data_collection_disabled=true.
support_permission = false
telemetry = false
feedback = false

[tools]
# Official setting: under ZDR, disable tools whose output xAI would have to host.
disable_zdr_incompatible_tools = true
# Official default is FALSE: built-in search/read would ingest gitignored files
# (.env, credentials) into model context. Keep true.
respect_gitignore = true

# Ignore all 23 vendor-bundled skills (2026-09-07, sota-audit L1 #40): every
# one either duplicates a dotfiles skill (review -> code-review; create-skill /
# skill-design-principles -> manage-skills; design / execute-plan / implement /
# create-workflow -> scope / large-feature), collides (`imagine` vs /imagine)
# or is irrelevant on this seat (game-*, pptx, docx, pdf, xAI-API build guide).
# Each costs ~70-130 description tokens per session start. `ignore` takes PATHS
# (GK-README §Skills Configuration); names from `grok inspect` 1.0.13. A new
# bundled skill shows up in `grok inspect` again — decide, then add it here.
[skills]
ignore = [
  "~/.grok/bundled/skills/build-with-ai",
  "~/.grok/bundled/skills/create-skill",
  "~/.grok/bundled/skills/create-workflow",
  "~/.grok/bundled/skills/design",
  "~/.grok/bundled/skills/docx",
  "~/.grok/bundled/skills/execute-plan",
  "~/.grok/bundled/skills/game-animation-frames",
  "~/.grok/bundled/skills/game-asset-core",
  "~/.grok/bundled/skills/game-character-consistency",
  "~/.grok/bundled/skills/game-tilesets",
  "~/.grok/bundled/skills/game-ui-icons",
  "~/.grok/bundled/skills/imagine",
  "~/.grok/bundled/skills/implement",
  "~/.grok/bundled/skills/long-running-background-tasks",
  "~/.grok/bundled/skills/pdf",
  "~/.grok/bundled/skills/pptx",
  "~/.grok/bundled/skills/pr-babysit",
  "~/.grok/bundled/skills/resume-claude",
  "~/.grok/bundled/skills/resume-codex",
  "~/.grok/bundled/skills/resume-cursor",
  "~/.grok/bundled/skills/review",
  "~/.grok/bundled/skills/skill-design-principles",
  "~/.grok/bundled/skills/statusline",
]

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

# MCP servers: none by default. chrome-devtools was retired here 2026-11-09 (a
# started server costs a node process per seat); the OpenDesign MCP is not
# configured either. Enable one on demand per session or project, see README
# "Enable the MCP on demand".

# codebase-memory dropped 2026-07-29 (trial ended).

# Sticky UI state grok wrote back (kept so a dotbot reinstall doesn't reset it).
[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
# Clock time next to each message (vendor config reference); `/timestamps`
# toggles it at runtime.
show_timestamps = true
