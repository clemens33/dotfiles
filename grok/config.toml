# Grok Build (xAI CLI) — symlinked to ~/.grok/config.toml via dotbot.
# Grok also WRITES sticky state here (ui prefs, marketplace flags) — expect churn.
# Skills need no config: Grok natively reads ~/.claude/skills/ (user scope).

[cli]
installer = "internal"
auto_update = true

[models]
# grok-4.6 = current Grok Build default (500k context; grok CLI 1.0.3, 4.5 also
# listed). "grok-build" is a rolling alias (currently resolves to 4.6); we pin
# the versioned id for deterministic behavior (switched off the alias
# 2026-08-14), and so a fallback can't drop to grok-composer-2.5-fast (Cursor's
# model, 200k). Effort: high is the server default; [models].default_reasoning_effort
# is deliberately left unset so we track the vendor default — override per
# session with --effort medium/xhigh, or set that key to persist a choice.
default = "grok-4.6"

[features]
# Match codex/claude: no telemetry, no permission prompts (trusted local use).
# NOTE: these flags only silence CLI telemetry/feedback. Training/code-retention
# opt-out is ACCOUNT state, not config: auth.json coding_data_retention_opt_out
# (set via /privacy). Verified 2026-08-14: uploads_enabled=false,
# upload_reason=zdr_team, data_collection_disabled=true.
support_permission = false
telemetry = false
feedback = false

[tools]
# Official setting: under ZDR, disable tools whose output xAI would have to host.
disable_zdr_incompatible_tools = true
# Official default is FALSE: built-in search/read would ingest gitignored files
# (.env, credentials) into model context. Keep true.
respect_gitignore = true

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

# MCP servers — same set as codex/config.toml, identical TOML shape.
[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "ide-assistant", "--enable-web-dashboard", "false"]
startup_timeout_sec = 30

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30

# 20s (STRICTER than other servers on purpose): this attaches to an existing
# browser at :9222 and polls for it, so if Chrome isn't up with
# --remote-debugging-port=9222 it burns the whole timeout before failing. Fast-
# fail is better than a long hang. Warm npx + a live browser connect in well
# under 20s; if Chrome is running and this still trips, launch Chrome first.
[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--browser-url=http://127.0.0.1:9222", "--no-usage-statistics", "--no-performance-crux"]
startup_timeout_sec = 20

# codebase-memory dropped 2026-07-29 (trial ended; serena covers it).

# Sticky UI state grok wrote back (kept so a dotbot relink doesn't reset it).
[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
