# improve colors
set -g default-terminal 'screen-256color'

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# inherit environment variables
set -g update-environment "http_proxy https_proxy KUBECONFIG"
# Mouse selection + system clipboard (2026-08-05): drag selects per-pane and
# copies via OSC 52 on release (Ghostty/cmux support it). Hold Option while
# dragging for terminal-native selection (spans panes) when you need it.
set -g mouse on
set -s set-clipboard on
