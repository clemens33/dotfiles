# Global cargo config — linked to ~/.cargo/config.toml by dotbot.
# Machine-wide conveniences only; per-project policy (rust-toolchain.toml,
# [lints], deny.toml, justfile) lives in each repo so clones stay reproducible.
#
# Rust itself is rustup-managed (NOT brew — see macos/Brewfile §4). Tools come
# via `cargo binstall` (prebuilt, seconds) rather than `cargo install` (source).

[alias]
c = "check"
t = "nextest run"
lint = "clippy --all-targets --all-features -- -D warnings"

# No linker override on macOS: zld is archived (its README says use lld),
# sold is paid/marginal, and rust-lld-by-default (1.90) is Linux-x86_64-only.
# Apple's linker has been fast since Xcode 15 — leave it alone. Build-time
# wins come from `cargo check`, nextest, and (optionally) sccache below.

[build]
# Default parallel jobs: the CPU count minus 2 (16 on the 18-core Mac), so one
# ordinary build leaves the system and the endpoint-security scanner two cores.
# A negative value means "logical CPUs plus the value" and clamps at 1 (cargo
# 1.97, build_config.rs), so a 2-core host builds with 1 job and does not fail.
# This file is the lowest-precedence cargo config layer: a repo's
# .cargo/config.toml build.jobs, the CARGO_BUILD_JOBS variable and -j all win.
jobs = -2
# rustc-wrapper: not here — config.fish exports RUSTC_WRAPPER=sccache only
# where sccache is installed (apt sccache / brew install sccache).
